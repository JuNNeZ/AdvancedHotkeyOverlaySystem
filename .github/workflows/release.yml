name: Package and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify addon metadata
        uses: ./.github/actions/verify

      # The packager skips a target silently when its token is empty, which
      # hides a half-published release. Surface it as a warning instead.
      - name: Report upload targets
        shell: bash
        run: |
          check() {
            if [ -n "$2" ]; then
              echo "$1: token set, upload will be attempted."
            else
              echo "::warning::$1 token is not set; the packager will skip that upload."
            fi
          }
          check CurseForge "$CF_API_KEY"
          check WoWInterface "$WOWI_API_TOKEN"
          check Wago "$WAGO_API_TOKEN"

      - name: Package and release
        uses: BigWigsMods/packager@v2
